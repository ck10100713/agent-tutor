site_name: OpenAI & Claude 開發教材
site_url: https://ck10100713.github.io/agent-tutor/
repo_url: https://github.com/ck10100713/agent-tutor
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: zh-TW
  features:
  - content.code.copy
  - search.highlight
  - navigation.top
  - navigation.tabs
  - navigation.footer
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: 深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: 淺色模式
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- attr_list
- md_in_html
- tables
- pymdownx.highlight:
    anchor_linenums: true
- toc:
    permalink: true
plugins:
- search:
    lang:
    - zh
    - en
- tags
extra:
  status:
    deprecated: 原文已封存
extra_javascript:
- assets/progress.js
extra_css:
- assets/progress.css
